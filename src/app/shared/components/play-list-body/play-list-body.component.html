<div class="play-list-body">
    <ul class="play-list-table-header">
        <li (click)="setSort('name')">Nombre</li>
        <li (click)="setSort('album')">Album</li>
        <li (click)="setSort('_id')">Fecha incorporación</li>
        <li><i class="ul ul1-clock-eight"></i></li>
    </ul>
    
    <ul class="play-list-rows" *ngFor="let track of tracks | sortBy:sortField:sortDirection">
        <li class="track-name">
            <ng-container *ngTemplateOutlet="coverSection; context: { track: track }"></ng-container>
        </li>
        <li class="track-name-opacity">
            {{ track.album }}
        </li>
        <li class="track-name-opacity">
            {{ track.album }}
        </li>
        <li class="track-name-opacity">
            {{ track.album }}
        </li>
    </ul>
</div>

<ng-template #coverSection let-track="track">
    <div class="cover-section">
        <img 
            appImgBroken 
            class="cover-track" 
            [src]="track.cover" 
            [alt]="track.name"
        >
        <div class="cover-info">
            <div class="name-track">{{ track.name }}</div>
            <div class="name-track-details">{{ track.artist.name }}</div>
        </div>
    </div>
</ng-template>
