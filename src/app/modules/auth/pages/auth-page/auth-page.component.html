<div class="login-auth-page">
    <div class="login-auth-wrapper">
        <h3>Para continuar, inicia sesión en Spotify</h3>
        <div class="login-social-zone">
            <button class="social-btn btn-fb"><i class="uil uil-facebook-f"></i>Continuar con Facebook</button>
            <button class="social-btn btn-apple"><i class="uil uil-apple">Continuar con Apple</i></button>
            <button class="social-btn"><i class="uil uil-google"></i>Continuar con Google</button>
        </div>
        <div class="separator"></div>

        <form class="login-auth-form">
            <div class="form-group">
                <label for="email">Dirección de correo</label>
               
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input formControlName="password" type="password">
            </div>
            <div class="form-steps">
                <a class="link" href="">¿Se te ha olvidado la contraseña?</a>
            </div>
            <div *ngIf="false">
                Ocurrió un error en tu email o password
            </div>
            <div class="form-action">
                <button (click)="sendLogin()" class="login social-btn">Inicar sesión</button>
            </div>
        </form>
    </div>
</div>
