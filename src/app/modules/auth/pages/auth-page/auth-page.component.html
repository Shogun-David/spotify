<div class="login-auth-page">
    <div class="login-auth-wrapper">
        <h3>Para continuar, inicia sesión en Spotify.</h3>
        
        <div class="login-social-zone">
            <button class="social-btn btn-fb "> <i class="uil uil-facebook-f" ></i></button>
            <button class="social-btn btn-apple"><i class="uil uil-apple"></i></button>
            <button class="social-btn"><i class="uil uil-google"></i></button>
        </div>
        
        <div class="separator"></div>
        
        <form (ngSubmit)="sendLogin()" [formGroup]="formLogin" class="login-e">
            <div class="form-group">
                <label for="email">Dirección de correo</label>
                <input formControlName="email" type="text" placeholder="Direct">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input formControlName="password" type="password" placeholder="Direct">
            </div>
            
            <div class="form-steps">
                | <a class="link" href="#">¿Se te ha olvidado la contraseña?</a>
            </div>
            
            <div *ngIf="false">
                | Ocurrio un error con tu email o password
            </div>
            
            <div class="form-action">
                | <button class="login social-btn">Iniciar sesión</button>
            </div>
        </form>
    </div>
</div>
